[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
pythonpath = ["."]
addopts = "-ra"

[tool.ruff]
target-version = "py312"
line-length = 100
include = ["*.py", "*.pyi", "pyproject.toml"]
exclude = [".git", ".pytest_cache", "__pycache__", ".venv", "reports"]

[tool.ruff.lint]
# Syntax/undefined-name checks and high-confidence pycodestyle errors.
select = ["E4", "E7", "E9", "F"]
